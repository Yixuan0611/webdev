<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="header.css">
    <link rel="stylesheet" type="text/css" href="Reco.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header>
        <div class="logo">DRAMS</div>
        <div class="hamburger">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
        <nav class="nav-bar">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="Edrama.html">English</a>
                </li>
                <li>
                    <a href="Cdrama.html">Chinese</a>
                </li>
                <li>
                    <a href="Kdrama.html">Korean</a>
                </li>
                <li>
                    <a href="Reco.html" class="active">Recommendations</a>
                </li>
            </ul>
        </nav>
    </header>
    
	<div class="wrapper">
		<h3>I have a drama to recommend!</h3>
		<form id="myForm">
            <fieldset>
                <legend>Basic Information</legend>
                <section id="words">
                <!--Drama name-->
                    <label for="title">Drama name: </label>
                    <input type="text" id="title" name="title" required>
                    <hr>
                <!--Language spoken-->
                    <p>Language spoken: </p>
                    <input type="checkbox" id="languageEnglish" name="language" value="English">
                    <label for="languageEnglish">English</label>
                    <br>
                    <input type="checkbox" id="languageChinese" name="language" value="Chinese">
                    <label for="languageChinese">Chinese</label>
                    <br>
                    <input type="checkbox" id="languageKorean" name="language" value="Korean">
                    <label for="languageKorean">Korean</label>
                    <br>
                    <label for="languageOthers">Others: </label>
                    <input type="text" id="languageOthers" name="languageOthers" size="10">
                    <hr>

                <!--Genre-->
                    <p>Genre: </p>
                    <input type="checkbox" id="genreRomance" name="genre" value="Romance">
                    <label for="genreRomance">Romance</label>
                    <br>
                    <input type="checkbox" id="genreComedy" name="genre" value="Comedy">
                    <label for="genreComedy">Comedy</label>
                    <br>
                    <input type="checkbox" id="genreHorror" name="genre" value="Horror">
                    <label for="genreHorror">Horror</label>
                    <br>
                    <input type="checkbox" id="genreMelodrama" name="genre" value="Melodrama">
                    <label for="genreMelodrama">Melodrama</label>
                    <br>
                    <label for="genreOthers">Others: </label>
                    <input type="text" id="genreOthers" name="genreOthers" size="10">
                    <hr>
                <!--Status-->
                    <label for="progress">On-going/Completed?</label>
                    <Select id="progress"name="progress">
                        <option>On-going</option>
                        <option>Completed</option>
                    </Select>
                </section>
            </fieldset>
            <br>
            <fieldset>
                <legend>WHY YES</legend>
                <textarea name="opinion" cols="30" rows="5" placeholder="Short description of the plot..." required></textarea>
                <br>
                <div class="rating">
                    <input type="number" id="rating" name="rating" hidden>
                    <i class='bx bxs-star star' style="--i: 0;"></i>
                    <i class='bx bxs-star star' style="--i: 1;"></i>
                    <i class='bx bxs-star star' style="--i: 2;"></i>
                    <i class='bx bxs-star star' style="--i: 3;"></i>
                    <i class='bx bxs-star star' style="--i: 4;"></i>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn submit" onclick="submitForm()">Submit</button>
                    <button type="reset" class="btn reset" id="resetButton" onclick="resetForm()">Reset</button>
                </div>
            </fieldset>
		</form>
	</div>
    <script src="header.js"></script>
    <script src="Reco.js"></script>
</body>
</html>
